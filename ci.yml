name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml opencv-python-headless pytest flake8 black

      - name: Lint
        run: |
          flake8 src tests app.py --max-line-length=100 --extend-ignore=E203,W503 || true
          black --check src tests app.py || true

      - name: Run smoke tests
        run: pytest tests/ -v
